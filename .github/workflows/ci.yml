# Nome que aparece na aba "Actions" do GitHub e no status do PR.
name: CI

# QUANDO rodar:
on:
  push:
    branches: [main]      # pushes diretos na main
  pull_request:           # qualquer PR (é aqui que o grosso acontece:
                          # você trabalha numa branch, abre PR pra main, o CI roda)

jobs:
  qa:
    name: QA              # ← rótulo exibido no GitHub (o resto continua igual)
    runs-on: ubuntu-latest

    steps:
      # 1) Baixa o seu código pra dentro da máquina do CI.
      - name: Baixar o código
        uses: actions/checkout@v4

      # 2) Instala o Python. Usamos 3.14 pra BATER com o seu ambiente local —
      #    assim o CI testa no mesmo Python em que você desenvolve.
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"        # guarda os pacotes baixados entre execuções (acelera)

      # 3) Instala as dependências: as de produção E as de teste.
      #    requirements.txt traz pandas/xgboost/sklearn (que os testes importam);
      #    requirements-dev.txt traz pytest e ruff.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 4) Linter: o código está limpo? (mesmo comando que você rodou)
      - name: Lint (ruff check)
        run: ruff check .

      # 5) Formatação: está no padrão? --check NÃO altera nada, só falha se
      #    alguém esqueceu de rodar "ruff format" antes de commitar.
      - name: Formatação (ruff format --check)
        run: ruff format --check .

      # 6) Testes: a lógica está correta? (inclui o teste anti-leakage)
      - name: Testes (pytest)
        run: pytest -v
