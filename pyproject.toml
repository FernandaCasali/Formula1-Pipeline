# Configuração do pytest para o projeto.
[tool.pytest.ini_options]

# ESTA é a linha-chave. Seus módulos em src/ se importam entre si por nome
# puro (ex.: "from store import load_season"). Isso só funciona se src/
# estiver no sys.path. Aqui dizemos ao pytest para adicionar src/ ao path
# automaticamente — sem isso, "import features" quebraria nos testes.
pythonpath = ["src"]

# Onde o pytest procura os testes. Mantém a coleta rápida e previsível.
testpaths = ["tests"]

# Padrões de nomes que o pytest reconhece como teste (é o padrão, mas
# deixamos explícito para quem for ler entender a convenção).
python_files = ["test_*.py"]
python_functions = ["test_*"]

# ===== Configuração do ruff (linter + formatter) =====
[tool.ruff]
# Limite de caracteres por linha. 100 é um meio-termo confortável para este
# projeto, que tem comentários densos em português (88, o padrão, apertaria
# demais as explicações linha a linha).
line-length = 100

# Versão de Python que o ruff assume ao aplicar regras de sintaxe moderna.
target-version = "py311"

[tool.ruff.lint]
# Quais famílias de regras ativar:
#   E = estilo (pycodestyle)   F = erros lógicos (pyflakes, ex.: import não usado)
#   I = ordenação de imports (isort)
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# app.py é a camada de apresentação (Streamlit): é quase todo HTML/CSS inline
# dentro de f-strings. Quebrar essas linhas pioraria a leitura, e o formatter
# não mexe em conteúdo de string. Então ignoramos SÓ o limite de linha (E501)
# SÓ neste arquivo — o resto do projeto continua sob o limite de 100.
"src/app.py" = ["E501"]